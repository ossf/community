# Sidebar tree.
#
# Sections are NOT listed by hand — each sets `derive:` and its children are
# generated from the data files by _includes/sidebar.html, so the sidebar can
# never drift from the catalog. (It did: this file once listed 32 projects,
# several twice, with titles out of sync with the data.)
#
#   derive: personas | problems | projects | publications
#     -> children are every record in that pool, titled by its `name` and
#        linked to /<derive>/<id>/.

- title: Browse by Persona
  url: /personas/
  derive: personas

- title: Browse by Problem
  url: /problems/
  derive: problems

- title: Browse by Project
  url: /projects/
  derive: projects

- title: Browse by Publication
  url: /publications/
  derive: publications

- title: About
  url: /about/
