# ORBIT (Open Resources for Baselines, Interoperability, and Tooling)
#
# MEMBERSHIP IS THIS FILE. A project listed below belongs to this working group;
# there is no `wg:` field on the project, so the two can never disagree. The
# build derives membership from the filename (theme/_plugins/catalog.rb).
#
# To move a project between working groups, move its entry between these files.
#
# Project assignments come from the list published in ossf/tac's README, which is
# the authoritative source. Do not add a project here on a hunch — if the TAC list
# does not place it, it belongs in uncategorized.yml until someone who knows says
# otherwise.
#
# EDITING YOUR PROJECT'S ENTRY — persona and problem ids come from
# data/definitions/, and the build fails on any id it can't resolve.
# `status:` on a relationship is `confirmed` or `needs-review` — needs-review
# means we want the project's own maintainers to check the claim. If that's
# you, correcting it, setting the status to confirmed, and deleting the note
# IS the edit we're hoping for. Run `make test` before opening a PR.

working_group:
  id: orbit
  name: ORBIT (Open Resources for Baselines, Interoperability, and Tooling)
  url: https://openssf.org/groups/orbit/
  kind: working-group
projects:
- id: gemara
  name: Gemara
  url: https://gemara.openssf.org/
  openssf_url: https://openssf.org/projects/gemara/
  insights: https://github.com/gemaraproj/gemara/blob/main/security-insights.yml
  description: >-
    Schemas, SDKs, and tooling implementing the Gemara GRC engineering model — machine-readable
    formats that bridge high-level compliance requirements and low-level technical evidence
    to enable automated risk assessment across security tooling.
  kind: project
  relationships:
  - kind: implements
    target: gemara-whitepaper
    status: confirmed
  personas:
  - id: ospo
    note: >-
      Expresses the organization's controls and compliance requirements in Gemara's shared
      model so they can be assessed consistently across projects.
  - id: security
    note: >-
      Maps threats, controls, and evidence onto Gemara's layered schema to drive automated,
      repeatable risk assessment.
  - id: devops
    note: >-
      Consumes Gemara's machine-readable model to automate control evaluation and evidence
      collection inside the pipeline.
  - id: executive
    note: >-
      Reads risk and compliance status rolled up through Gemara's model rather than from disconnected,
      hand-assembled spreadsheets.
  problems:
  - id: policy-compliance
    note: >-
      Encodes governance, risk, and compliance requirements as a shared data model so controls
      map cleanly between regulations and evidence.
  - id: security-posture
    note: >-
      Standardizes how risk and control evidence are expressed so posture can be assessed
      automatically and compared across projects.
- id: minder
  name: Minder
  url: https://github.com/mindersec/minder
  openssf_url: https://openssf.org/projects/minder/
  insights: https://github.com/mindersec/minder/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    A software-supply-chain security platform that continuously verifies secure practices
    and enforces standardized policies across repositories and artefacts.
  kind: project
  personas:
  - id: developer
    note: >-
      Uses Minder to proactively manage their security posture and attest secure practices
      to downstream consumers.
  - id: ospo
    note: >-
      Deploys Minder to establish and continuously verify standardized security policies across
      all internal and open source project portfolios.
  - id: security
    note: >-
      Maps repository configurations to enterprise threat models, using Minder to continuously
      enforce secure development lifecycles and prevent configuration drift.
  - id: devops
    note: >-
      Configures Minder to execute security posture management checks and minimize risk along
      the supply chain.
  - id: package-manager
    note: >-
      Ensures that published packages originate from repositories that continuously pass strict
      security posture checks.
  - id: executive
    note: >-
      Leverages verifiable proof of secure development practices to satisfy auditors and enterprise
      customers through continuous attestation.
  problems:
  - id: secure-configuration
    note: >-
      Continuously verifies repository configuration against secure-by-default rules and prevents
      drift over time.
  - id: policy-compliance
    note: >-
      Enforces standardized security policy across whole portfolios of repositories and artefacts
      from one control plane.
  compatible_with: [openssf-scorecard]
- id: osps-baseline
  name: OSPS Baseline
  url: https://baseline.openssf.org/
  openssf_url: https://openssf.org/projects/osps-baseline/
  insights: >-
    https://github.com/ossf/security-baseline/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    The Open Source Project Security Baseline — a consensus-driven minimum set of security
    requirements for projects to adopt and for consumers to expect.
  kind: publication
  personas:
  - id: developer
    note: >-
      Adopts the OSPS Baseline to implement fundamental security steps, like secure workflows
      and disclosure policies, early in development.
  - id: ospo
    note: >-
      Uses the OSPS Baseline to define and enforce security expectations for projects across
      the enterprise.
  - id: security
    note: >-
      Integrates the OSPS Baseline to enforce structured security requirements and reduce
      defects early in the software creation phase.
  - id: devops
    note: >-
      Configures pipeline guardrails to automatically verify that projects adhere to the fundamental
      practices outlined in the baseline.
  - id: package-manager
    note: >-
      Requires adherence to the baseline as a prerequisite for verifying or promoting packages
      within the repository ecosystem.
  - id: executive
    note: >-
      Adopts the structured baseline to ensure organizational compliance with policies and
      regulations like the Cyber Resilience Act.
  problems:
  - id: policy-compliance
    note: >-
      Provides a consensus minimum set of requirements that maps cleanly onto regulations
      like the Cyber Resilience Act.
  - id: security-posture
    note: >-
      Defines the floor of expected security practices so projects can be measured against
      a shared bar.
  similar_to: [best-practices-badge]
  compatible_with: [minder]
- id: privateer
  name: Privateer
  url: https://privateerproj.com/
  description: >-
    A validation framework that simplifies infrastructure testing and compliance validation. Built with infrastructure engineers in mind, pvtr helps accelerate security and compliance validation of any software asset.
  kind: project
- id: security-insights
  name: Security Insights Specification
  url: https://security-insights.openssf.org/
  openssf_url: https://openssf.org/projects/security-insights/
  insights: >-
    https://github.com/ossf/security-insights-spec/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    A machine-processable YAML specification that lets a project declare its security posture,
    vulnerability-handling process, and supporting resources.
  kind: publication
  personas:
  - id: developer
    note: >-
      Creates a Security Insights file to report their project's security information in a
      machine-processable way.
  - id: ospo
    note: >-
      Aggregates Security Insights files across projects to programmatically monitor the security
      health and maintenance status of open source dependencies.
  - id: security
    note: >-
      Consumes Security Insights metadata to automatically assess the vulnerability management
      practices of third-party libraries.
  - id: devops
    note: >-
      Uses the machine-readable Security Insights YAML file to automatically approve or block
      dependencies during pipeline execution.
  - id: package-manager
    note: >-
      Incorporates Security Insights data into the repository index to allow users to search
      and filter packages based on their security policies.
  - id: executive
    note: >-
      Analyzes machine-processable metadata and prioritization to evaluate operational risk
      and establish trust in vendors.
  problems:
  - id: security-posture
    note: >-
      Lets a project self-declare its security posture in a machine-readable file that consumers
      can aggregate and compare.
  - id: dependency-visibility
    note: >-
      Surfaces a project's vulnerability-handling process and resources so downstream consumers
      can reason about it programmatically.
  compatible_with: [openssf-scorecard]
