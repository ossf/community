# ORBIT (Open Resources for Baselines, Interoperability, and Tooling)
#
# MEMBERSHIP IS THIS FILE. A project listed below belongs to this working group;
# there is no `wg:` field on the project, so the two can never disagree. The
# build derives membership from the filename (theme/_plugins/catalog.rb).
#
# To move a project between working groups, move its entry between these files.
#
# Project assignments come from the list published in ossf/tac's README, which is
# the authoritative source. Do not add a project here on a hunch — if the TAC list
# does not place it, it belongs in uncategorized.yml until someone who knows says
# otherwise.
#
# EDITING YOUR PROJECT'S ENTRY — `name` and `description` are stated here;
# `insights:` points at your repository's Security Insights file
# (https://github.com/ossf/security-insights-spec), either as the file's GitHub
# URL or as `owner/repo` to have it discovered at any of the standard paths.
# When that file is valid, its project name, homepage, repositories, license,
# status, administrators and vulnerability-reporting link enrich the record and
# the SI name wins over the local one; when it is missing or
# invalid the record still renders from what is here, with a notice. The build
# reads a committed snapshot (data/generated/insights.json) refreshed by
# `make refresh-insights`. Persona and problem ids come from data/definitions/,
# and the build fails on any id it can't resolve. `status:` on a relationship is
# `confirmed` or `needs-review` — needs-review means we want the project's own
# maintainers to check the claim. If that's you, correcting it, setting the
# status to confirmed, and deleting the note IS the edit we're hoping for.
# Run `make test` and `make lint`
# before opening a PR.

working_group:
  id: orbit
  name: ORBIT (Open Resources for Baselines, Interoperability, and Tooling)
  description: >-
    Develops and maintains interoperable resources for the identification and presentation of
    security-relevant data, providing a home for collaborative activities, best practice
    definitions, documentation, testing, integration, and other artifacts supporting the
    mission.
  url: https://openssf.org/groups/orbit/
  kind: working-group
projects:
- id: gemara
  name: Gemara
  insights: https://github.com/gemaraproj/gemara/blob/main/security-insights.yml
  openssf_url: https://openssf.org/projects/gemara/
  description: >-
    Schemas, SDKs, and tooling implementing the Gemara model: Machine-readable
    formats that bridge high-level compliance requirements and low-level technical evidence
    to enable automated risk assessment across security tooling.
  kind: project
  relationships:
  - kind: implements
    target: gemara-whitepaper
    status: confirmed
  personas:
  - id: developer
    note: >-
      Capture all requirements, from security to design documents, into machine-ready specifications
      to ensure that your developer and agents have shared clarity on what is needed at every stage.
  - id: devops
    note: >-
      Use Gemara's machine-readable strategy to automate security and GRC requirements
      inside the pipeline.
  - id: executive
    note: >-
      Ingest diverse data points into traceable single-pane-of-glass views using Gemara specifications
      rather than from disconnected, hand-compiled summaries.
  - id: ospo
    note: >-
      Express your organization's policies in Gemara's shared
      model so they can be assessed consistently across projects.
  - id: package-manager
    note: >-
      Registries already check for malicious or tampered packages before
      publishing them, but the results stay internal. In principle you could publish those checks
      as Gemara evaluations, so users can audit what was checked on a package and when.
      (Not yet in active use)
  - id: security
    note: >-
      Map threats, controls, and evidence onto Gemara's layered schema to drive automated,
      repeatable security audits.
  problems:
  - id: policy-compliance
    note: >-
      Encodes governance, risk, and compliance requirements as a shared data model so controls
      map cleanly between regulations and evidence.
  - id: security-posture
    note: >-
      Standardizes how risk and control evidence are expressed so posture can be assessed
      automatically and compared across projects.
- id: gemara-whitepaper
  name: Gemara Whitepaper
  openssf_url: https://openssf.org/projects/gemara/  # published by the Gemara project; no page of its own
  description: >-
    "Gemara: A Governance, Risk, and Compliance Engineering Model for Automated Risk Assessment" —
    the whitepaper defining Gemara's layered model of governance, risk, and compliance activities
    and how they interoperate.
  kind: publication
  personas:
  - id: devops
    note: >-
      See where the SDLC sits in the GRC model: platform teams own the sensitive activities that
      controls are written about, while enforcement and evaluation happen around them.
  - id: executive
    note: >-
      Understand why a traceable chain from threat to control to evidence lets you trust a
      compliance report without re-checking it by hand.
  - id: ospo
    note: >-
      Learn how responsibility splits across the different teams and tools, and how you can
      help shape strategic adoption of security and compliance tools.
  - id: security
    note: >-
      Organize the concepts you deal with daily, from threats and controls through evaluation,
      enforcement, and audit, before choosing or building the tools that implement them.
  problems:
  - id: policy-compliance
    note: >-
      Explains why hand-assembled GRC can no longer keep pace with development, and sets out the
      principles that let compliance act as an automated quality gate with useful audit processes.
  - id: security-posture
    note: >-
      Separates the layers that define expectations from the layers that measure against them,
      so posture can be assessed continuously instead of only at audit time.
- id: minder
  name: Minder
  insights: https://github.com/mindersec/minder/blob/main/.github/security-insights.yml
  openssf_url: https://openssf.org/projects/minder/
  description: >-
    A software-supply-chain security platform that continuously verifies secure practices
    and enforces standardized policies across repositories and artefacts.
  kind: project
  relationships:
  - kind: consumes
    target: osps-baseline
    status: needs-review
    note: >-
      Baseline requirements can be enforced as Minder policy profiles across an organization's
      repositories.
  personas:
  - id: developer
    note: >-
      Uses Minder to proactively manage their security posture and attest secure practices
      to downstream consumers.
  - id: ospo
    note: >-
      Deploys Minder to establish and continuously verify standardized security policies across
      all internal and open source project portfolios.
  - id: security
    note: >-
      Maps repository configurations to enterprise threat models, using Minder to continuously
      enforce secure development lifecycles and prevent configuration drift.
  - id: devops
    note: >-
      Configures Minder to execute security posture management checks and minimize risk along
      the supply chain.
  - id: package-manager
    note: >-
      Ensures that published packages originate from repositories that continuously pass strict
      security posture checks.
  - id: executive
    note: >-
      Leverages verifiable proof of secure development practices to satisfy auditors and enterprise
      customers through continuous attestation.
  problems:
  - id: secure-configuration
    note: >-
      Continuously verifies repository configuration against secure-by-default rules and prevents
      drift over time.
  - id: policy-compliance
    note: >-
      Enforces standardized security policy across whole portfolios of repositories and artefacts
      from one control plane.
  compatible_with: [openssf-scorecard]
- id: osps-baseline
  name: OSPS Baseline
  insights: ossf/security-baseline
  openssf_url: https://openssf.org/projects/osps-baseline/
  description: >-
    The Open Source Project Security Baseline — a consensus-driven minimum set of security
    requirements for projects to adopt and for consumers to expect.
  kind: publication
  personas:
  - id: developer
    note: >-
      Adopts the OSPS Baseline to implement fundamental security steps, like secure workflows
      and disclosure policies.
  - id: ospo
    note: >-
      Uses the OSPS Baseline to define and enforce security expectations for projects across
      the enterprise.
  - id: security
    note: >-
      Integrates the OSPS Baseline to enforce structured security requirements and reduce
      incidents in the software creation phase.
  - id: devops
    note: >-
      Configures pipeline guardrails to automatically verify that projects adhere to the fundamental
      practices outlined in the OSPS Baseline.
  - id: package-manager
    note: >-
      Requires adherence to the OSPS Baseline as a prerequisite for verifying or promoting packages
      within the repository ecosystem.
  - id: executive
    note: >-
      Requires the OSPS Baseline for first-party projects to ensure organizational compliance with policies and
      regulations like the Cyber Resilience Act.
  problems:
  - id: policy-compliance
    note: >-
      Provides a consensus minimum set of requirements that maps cleanly onto regulations
      like the Cyber Resilience Act.
  - id: security-posture
    note: >-
      Defines the floor of expected security practices so projects can be measured against
      a shared bar.
  - id: secure-configuration
    note: >-
      Defines the floor of expected repository configuration for secure software development.
  similar_to: [best-practices-badge, openssf-scorecard]
  compatible_with: [darnit, minder, privateer]
  relationships:
  - kind: implements
    target: gemara
    status: confirmed
    note: >-
      Publishes its control catalog as a Gemara Layer 2 document.
- id: privateer
  name: Privateer
  insights: https://github.com/privateerproj/pvtr/blob/main/.github/security-insights.yml
  openssf_url: https://openssf.org/projects/privateer/
  description: >-
    A plugin-based framework for evaluations. Privateer orchestrates private or community-built
    plugins, then writes a Gemara-compatible report that people and tools can both read.
  kind: project
  relationships:
  - kind: implements
    target: gemara
    status: confirmed
    note: >-
      Operates at Gemara's evaluation layer and scaffolds plugins from Gemara control catalogs.
  - kind: consumes
    target: osps-baseline
    status: confirmed
    note: >-
      Validates against the OSPS Baseline control catalog; the GitHub repository plugin checks
      repositories against it.
  - kind: produces
    target: gemara
    status: confirmed
    note: >-
      Emits its results as Gemara Evaluation Logs.
  personas:
  - id: developer
    note: >-
      Run a Privateer plugin against your own repository to see which Baseline controls it
      meets, and write plugins for systems the community hasn't covered yet.
  - id: security
    note: >-
      Turn written controls into runnable checks and get evidence from each one, instead of
      collecting spreadsheets and screenshots.
  - id: devops
    note: >-
      Run Privateer in CI so evaluation results reach the pipeline and the GitHub Security tab
      on every run.
  - id: ospo
    note: >-
      Evaluate projects across your portfolio against a shared control catalog and publish the
      results in a common format.
  problems:
  - id: policy-compliance
    note: >-
      Closes the gap between what a policy says and what a system actually does by evaluating
      written controls automatically.
  - id: security-posture
    note: >-
      Produces a control-by-control record of what was checked and found, in a form dashboards and
      GRC platforms can read without conversion.
  - id: secure-configuration
    note: >-
      Plugins inspect live configuration, such as repository settings, against the controls a
      catalog requires.
- id: security-insights
  name: Security Insights Specification
  insights: https://github.com/ossf/security-insights-spec/blob/main/.github/security-insights.yml
  openssf_url: https://openssf.org/projects/security-insights/
  description: >-
    A machine-processable YAML specification that lets a project declare its security posture,
    vulnerability-handling process, and supporting resources.
  kind: publication
  personas:
  - id: developer
    note: >-
      Creates a Security Insights file to report their project's security information in a
      machine-processable way.
  - id: ospo
    note: >-
      Aggregates Security Insights files across projects to programmatically monitor the security
      health and maintenance status of open source dependencies.
  - id: security
    note: >-
      Consumes Security Insights metadata to automatically assess the vulnerability management
      practices of third-party libraries.
  - id: devops
    note: >-
      Uses the machine-readable Security Insights YAML file to automatically approve or block
      dependencies during pipeline execution.
  - id: package-manager
    note: >-
      Incorporates Security Insights data into the repository index to allow users to search
      and filter packages based on their security policies.
  - id: executive
    note: >-
      Analyzes machine-processable metadata and prioritization to evaluate operational risk
      and establish trust in vendors.
  problems:
  - id: security-posture
    note: >-
      Lets a project self-declare its security posture in a machine-readable file that consumers
      can aggregate and compare.
  - id: dependency-visibility
    note: >-
      Surfaces a project's vulnerability-handling process and resources so downstream consumers
      can reason about it programmatically.
  compatible_with: [openssf-scorecard]
