# Securing Software Repositories
#
# MEMBERSHIP IS THIS FILE. A project listed below belongs to this working group;
# there is no `wg:` field on the project, so the two can never disagree. The
# build derives membership from the filename (theme/_plugins/catalog.rb).
#
# To move a project between working groups, move its entry between these files.
#
# Project assignments come from the list published in ossf/tac's README, which is
# the authoritative source. Do not add a project here on a hunch — if the TAC list
# does not place it, it belongs in uncategorized.yml until someone who knows says
# otherwise.
#
# EDITING YOUR PROJECT'S ENTRY — persona and problem ids come from
# data/definitions/, and the build fails on any id it can't resolve.
# `status:` on a relationship is `confirmed` or `needs-review` — needs-review
# means we want the project's own maintainers to check the claim. If that's
# you, correcting it, setting the status to confirmed, and deleting the note
# IS the edit we're hoping for. Run `make test` before opening a PR.

working_group:
  id: securing-software-repositories
  name: Securing Software Repositories
  url: https://openssf.org/community/openssf-working-groups/
  kind: working-group
projects:
- id: malicious-packages
  name: Malicious Packages
  openssf_url: https://openssf.org/projects/malicious-packages/
  description: >-
    An open source database of reports of malicious packages publshed on open source package repositories.
  kind: project
- id: package-analysis
  name: Package Analysis
  openssf_url: https://openssf.org/projects/package-analysis/
  description: >-
    Dynamically and statically analyzes packages from open source package registries to detect
    malicious behavior such as credential exfiltration and backdoors.
  kind: project
- id: rstuf
  name: Repository Service for TUF (RSTUF)
  url: https://repository-service-tuf.readthedocs.io/
  openssf_url: https://openssf.org/projects/repository-service-for-tuf/
  insights: >-
    https://github.com/repository-service-tuf/repository-service-tuf/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    A drop-in implementation of The Update Framework (TUF) that protects software repositories
    from compromise, rollback, and man-in-the-middle attacks.
  kind: project
  personas:
  - id: developer
    note: >-
      Relies on RSTUF-backed repositories to confidently pull dependencies without fear of
      targeted man-in-the-middle or rollback attacks.
  - id: ospo
    note: >-
      Recommends RSTUF to ensure the organization's internally hosted artifact repositories
      are resilient against compromise.
  - id: security
    note: >-
      Implements The Update Framework (TUF) via RSTUF to secure software delivery architectures
      and protect cryptographic root keys.
  - id: devops
    note: >-
      Configures build pipelines to exclusively interact with RSTUF-secured repositories to
      guarantee the integrity of fetched dependencies.
  - id: package-manager
    note: >-
      Implements RSTUF to secure content downloads against tampering between the remote repository
      and the client.
  - id: executive
    note: >-
      Reduces enterprise liability by ensuring all software updates distributed to customers
      are cryptographically verified and secure.
  problems:
  - id: artifact-signing
    note: >-
      Cryptographically signs repository metadata so clients can verify content has not been
      tampered with in transit.
  - id: build-provenance
    note: >-
      Protects the distribution chain against rollback and man-in-the-middle attacks between
      repository and client.
  similar_to: [sigstore]
  compatible_with: [slsa]
