# Global Cyber Policy
#
# MEMBERSHIP IS THIS FILE. A project listed below belongs to this working group;
# there is no `wg:` field on the project, so the two can never disagree. The
# build derives membership from the filename (theme/_plugins/catalog.rb).
#
# To move a project between working groups, move its entry between these files.
#
# Project assignments come from the list published in ossf/tac's README, which is
# the authoritative source. Do not add a project here on a hunch — if the TAC list
# does not place it, it belongs in uncategorized.yml until someone who knows says
# otherwise.
#
# This working group currently hosts no projects.
#
# EDITING YOUR PROJECT'S ENTRY — `name` and `description` are stated here;
# `insights:` points at your repository's Security Insights file
# (https://github.com/ossf/security-insights-spec), either as the file's GitHub
# URL or as `owner/repo` to have it discovered at any of the standard paths.
# When that file is valid, its project name, homepage, repositories, license,
# status, administrators and vulnerability-reporting link enrich the record and
# the SI name wins over the local one; when it is missing or
# invalid the record still renders from what is here, with a notice. The build
# reads a committed snapshot (data/generated/insights.json) refreshed by
# `make refresh-insights`. Persona and problem ids come from data/definitions/,
# and the build fails on any id it can't resolve. `status:` on a relationship is
# `confirmed` or `needs-review` — needs-review means we want the project's own
# maintainers to check the claim. If that's you, correcting it, setting the
# status to confirmed, and deleting the note IS the edit we're hoping for.
# Run `make test` and `make lint`
# before opening a PR.

working_group:
  id: global-cyber-policy
  name: Global Cyber Policy
  description: >-
    Assembles subject matter experts from many disciplines to collaboratively discuss
    legislation, regulation, and cybersecurity frameworks and standards that can help
    stakeholders of all backgrounds meet their compliance obligations.
  url: https://openssf.org/groups/global-cyber-policy/
  kind: working-group
projects: []
