# UNCATEGORIZED — projects with no working group recorded yet.
#
# THIS IS A HOLDING PEN, NOT A WORKING GROUP. The project list in ossf/tac's
# README does not place these, and guessing would publish a fact we do not have.
# Move an entry into the right working-groups/<wg>.yml file to categorise it —
# that, by itself, is the whole change.
#
# These are not one problem. As of this writing:
#
#   gemara, gemara-whitepaper,
#   osps-baseline              likely ORBIT, but unconfirmed by the TAC list.
#   slsa-github-generator,
#   slsa-verifier              sub-projects of SLSA, which is Supply Chain
#                              Integrity. Whether a sub-project inherits its
#                              parent's WG is an open question.
#   in-toto                    a CNCF project. It may have no OpenSSF WG at all,
#                              in which case "uncategorized" is the wrong word
#                              for it and the model needs an answer for
#                              non-OpenSSF entries.
#   sigstore, openbao, rstuf   established projects the TAC list does not place.
#   fuzzingbrain, oss-crs      formation-stage; scope still provisional.
#
# EDITING YOUR PROJECT'S ENTRY — persona and problem ids come from
# data/definitions/, and the build fails on any id it can't resolve.
# `status:` on a relationship is `confirmed` or `needs-review` — needs-review
# means we want the project's own maintainers to check the claim. If that's
# you, correcting it, setting the status to confirmed, and deleting the note
# IS the edit we're hoping for. Run `make test` and `make lint`
# before opening a PR.

projects:
- id: bomctl
  name: Bomctl
  url: https://github.com/bomctl/bomctl
  openssf_url: https://openssf.org/projects/bomctl/
  description: >-
    Format-agnostic Software Bill of Materials tooling that bridges the gap between SBOM generation
    and SBOM analysis — fetching, merging, and manipulating SBOMs across SPDX and CycloneDX.
  kind: project
  relationships:
  - kind: consumes
    target: sbom
    status: needs-review
    note: >-
      Fetches and merges existing SPDX and CycloneDX documents from registries and repositories.
  - kind: produces
    target: sbom
    status: needs-review
    note: >-
      Emits the merged, translated, or otherwise manipulated SBOMs it assembles.
  personas:
  - id: developer
    note: >-
      Fetches and merges the SBOMs for their project's dependencies into a single document
      they can inspect and hand downstream.
  - id: ospo
    note: >-
      Normalizes SBOMs arriving in mixed formats into a consistent inventory the organization
      can track across every project.
  - id: security
    note: >-
      Pulls together SBOMs from disparate sources so a component can be traced wherever it
      appears in the portfolio.
  - id: devops
    note: >-
      Wires bomctl into the pipeline to fetch, merge, and reformat SBOMs as a build step rather
      than a manual chore.
  - id: package-manager
    note: >-
      Translates and consolidates incoming SBOMs so the registry can serve a clean, format-consistent
      component inventory.
  problems:
  - id: dependency-visibility
    note: >-
      Bridges SBOM generation and analysis by fetching, merging, and translating bills of
      materials into one queryable inventory.
  compatible_with: [protobom, guac]
- id: cve-bin-tool
  name: CVE-BIN-TOOL
  url: https://github.com/ossf/cve-bin-tool
  description: >-
    A tool to help you find known vulnerabilities in software, using data from the National Vulnerability Database (NVD) list of Common Vulnerabilities and Exposures (CVEs) as well as known vulnerability data from Redhat, Open Source Vulnerability Database (OSV), Gitlab Advisory Database (GAD), and Curl.
  kind: project
- id: fuzz-introspector
  name: Fuzz Introspector
  url: https://openssf.org/projects/fuzz-introspector/
  openssf_url: https://openssf.org/projects/fuzz-introspector/
  description: >-
    Improves the fuzzing experience for projects by providing visibility into fuzzer coverage
    and reachability.
  kind: project
- id: protobom
  name: Protobom / SBOM Tools
  url: https://github.com/protobom/protobom
  openssf_url: https://openssf.org/projects/protobom/
  insights: https://github.com/protobom/protobom/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    A shared library and toolset for generating, translating, and consuming Software Bills
    of Materials in standard formats such as SPDX and CycloneDX.
  kind: project
  relationships:
  - kind: produces
    target: sbom
    status: needs-review
    note: >-
      Generates and translates SBOM documents in SPDX and CycloneDX formats.
  - kind: consumes
    target: sbom
    status: needs-review
    note: >-
      Reads standard-format SBOMs into its protobuf representation for other tooling to work
      with.
  personas:
  - id: developer
    note: >-
      Integrates SBOM generation tools into their local build process to automatically document
      the components used in their software.
  - id: ospo
    note: >-
      Mandates the use of standard SBOM formats and tools like Protobom to maintain a comprehensive
      inventory of third-party software assets.
  - id: security
    note: >-
      Analyzes ingested SBOMs to rapidly identify and triage vulnerable components across
      the organization's application portfolio.
  - id: devops
    note: >-
      Embeds Protobom into the automated release pipeline to seamlessly generate and attach
      SBOMs to every compiled artifact.
  - id: package-manager
    note: >-
      Distributes generated Software Bill of Materials (SBOMs) alongside packages to provide
      consumers with a transparent component inventory.
  - id: executive
    note: >-
      Demands SBOMs as trust signals to assess post-release risk and make informed consumption
      decisions.
  problems:
  - id: dependency-visibility
    note: >-
      Generates and translates SBOMs in standard formats so the component inventory travels
      with the artefact.
  compatible_with: [guac]
- id: sbomit
  name: SBOMit
  url: https://sbomit.dev/
  openssf_url: https://openssf.org/projects/sbomit/
  description: >-
    An SBOM-format-independent method that embeds in-toto and Witness attestations into Software
    Bills of Materials, cryptographically validating the steps performed across the software
    supply chain.
  kind: project
  relationships:
  - kind: consumes
    target: in-toto-attestation
    status: needs-review
    note: >-
      Embeds in-toto and Witness attestations into the SBOMs it processes.
  - kind: produces
    target: sbom
    status: needs-review
    note: >-
      Outputs SBOMs carrying embedded attestations for each supply-chain step.
  personas:
  - id: developer
    note: >-
      Generates an SBOM whose entries are backed by signed attestations of how each component
      was actually built.
  - id: security
    note: >-
      Validates the in-toto attestations carried inside an SBOM to confirm the supply-chain
      steps behind every listed component.
  - id: devops
    note: >-
      Produces attestation-backed SBOMs as a release step so provenance travels with the component
      inventory automatically.
  - id: package-manager
    note: >-
      Distributes SBOMs whose contents are cryptographically tied to verifiable build steps,
      raising the trust of served packages.
  problems:
  - id: build-provenance
    note: >-
      Binds in-toto and Witness attestations to SBOM entries so each component carries verifiable
      proof of how it was built.
  - id: dependency-visibility
    note: >-
      Produces a standard SBOM as the carrier for that provenance, keeping the component inventory
      and its evidence together.
  - id: artifact-signing
    note: >-
      Relies on signed attestations over components, so the bill of materials itself becomes
      cryptographically verifiable.
  compatible_with: [protobom, slsa, sigstore]
- id: openbao
  name: OpenBao
  url: https://openbao.org/
  openssf_url: https://openssf.org/projects/openbao/
  insights: https://github.com/openbao/openbao/blob/main/.github/security-insights.yml
  description: >-
    A community-governed, open source secrets management platform for storing, rotating, and
    brokering access to secrets, credentials, tokens, and cryptographic keys.
  kind: project
  personas:
  - id: developer
    note: >-
      Uses OpenBao APIs to securely fetch database credentials and API keys without hardcoding
      them into source code.
  - id: ospo
    note: >-
      Promotes OpenBao as the standard, open-source-governed solution for managing secrets
      across the organization's projects.
  - id: security
    note: >-
      Designs centralized secrets management architectures using OpenBao to enforce strict
      access controls and credential rotation.
  - id: devops
    note: >-
      Integrates OpenBao to securely inject ephemeral credentials into CI/CD pipelines during
      automated builds and deployments.
  - id: package-manager
    note: >-
      Utilizes OpenBao to manage secrets and signing keys, ensuring the untampered and trusted
      distribution of packages.
  - id: executive
    note: >-
      Ensures regulatory compliance and software sovereignty through a community-governed
      secrets management solution, mitigating risks associated with vendor lock-in and licensing
      shifts.
  problems:
  - id: secrets-management
    note: >-
      Stores, rotates, and brokers access to credentials and signing keys so they never get
      hardcoded or leaked.
  compatible_with: [sigstore]
- id: sigstore
  name: Sigstore
  url: https://www.sigstore.dev/
  openssf_url: https://openssf.org/projects/sigstore/
  insights: https://github.com/sigstore/sigstore/blob/main/SECURITY-INSIGHTS.yml
  description: >-
    A free, identity-based artefact-signing service backed by a public transparency log so
    anyone can verify who built what.
  kind: project
  personas:
  - id: developer
    note: >-
      Adopts Sigstore to cryptographically sign artifacts and ensure their integrity early
      in the release process.
  - id: ospo
    note: >-
      Standardizes on keyless signing (Sigstore) across the enterprise to eliminate the overhead
      of managing long-lived cryptographic keys.
  - id: security
    note: >-
      Validates the transparency log to audit the provenance and authenticity of software
      components used in production.
  - id: devops
    note: >-
      Deploys Sigstore to enable identity-based (keyless) signing via OIDC, eliminating the
      risk of compromised long-lived build secrets and automating artifact verification in
      the pipeline.
  - id: package-manager
    note: >-
      Integrates Sigstore natively into the package registry to automatically verify incoming
      artifact signatures and display provenance to users.
  - id: executive
    note: >-
      Verifies cryptographic signatures as trust signals to confirm artifact integrity post-release.
  problems:
  - id: artifact-signing
    note: >-
      Provides keyless, identity-based signing backed by a public transparency log so anyone
      can verify who built what.
  - id: build-provenance
    note: >-
      Records signatures in a transparency log, making artefact provenance independently auditable
      downstream.
  similar_to: [rstuf]
  compatible_with: [slsa, openbao]

