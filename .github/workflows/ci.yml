name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Newer pushes to a PR supersede in-flight runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # pa11y-ci (run by `make test`) needs Node >= 22.13.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      # Builds the site (catalog_pages.rb fails on duplicate ids and
      # unresolvable persona/problem/relationship targets), link-checks it,
      # then runs the WCAG 2 AA scan over every page in both themes.
      - run: make test A11Y_SAMPLE=0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: pipx install yamllint

      # RuboCop over theme/_plugins, yamllint over data/ and the workflows.
      - run: make lint

      # Workflow syntax and action refs. Not in `make lint` — it's a Go binary,
      # not a gem, and these are the only files it checks.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
