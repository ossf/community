name: Refresh Security Insights snapshot

# Re-reads every project's Security Insights file and opens a PR when
# data/generated/insights.json changes. The site build never touches the
# network; this is the only place the snapshot is produced.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # create-pull-request brings its own token; nothing else needs the checkout one.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          # No go.sum in this repo; `go run pkg@version` resolves the module itself.
          cache: false

      - name: Regenerate snapshot
        # The si-tooling release is pinned in the Makefile (SI_FETCH). make
        # writes to a temp file and only replaces the snapshot when the fetch
        # exits 0, so a rate-limited or failed run never gets committed.
        run: make refresh-insights
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          add-paths: data/generated/insights.json
          branch: bot/refresh-insights
          commit-message: "chore: refresh Security Insights snapshot"
          signoff: true
          title: "chore: refresh Security Insights snapshot"
          body: |
            Automated re-read of every `insights:` target in `data/working-groups/`.
            Review the diff for projects that appeared, disappeared, or changed
            name or homepage, then merge.
